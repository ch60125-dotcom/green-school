<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>淨零綠校園大作戰</title>
<style>
:root{--g:#2f9e57;--g2:#e8f6ec;--y:#ffcf3f;--r:#e2574c;--b:#2f7fd1;--ink:#24352b;--card:#fff;--line:#d8e6dc}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:#f1f8ee;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:17px;padding:10px 18px;background:var(--g);color:#fff;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button.ghost{background:#fff;color:var(--g);border:2px solid var(--g)}
button.gray{background:#9aa7a0}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{margin:.3em 0}
/* 開始畫面 */
#start{max-width:560px;margin:30px auto;background:#fff;border-radius:22px;padding:26px 24px;box-shadow:0 8px 30px rgba(40,90,50,.15);text-align:center}
#start h1{font-size:32px;color:var(--g)}
#start .sub{color:#5a6d60;margin-bottom:16px}
.field{margin:12px 0;text-align:left}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input{width:100%;font-size:19px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-family:inherit}
.lvbtns{display:flex;gap:8px;flex-wrap:wrap}
.lvbtns button{flex:1;min-width:120px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.lvbtns button.on{background:var(--g2);border-color:var(--g);color:var(--g)}
.err{color:var(--r);min-height:1.4em;margin-top:6px}
/* HUD */
#hud{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);border-bottom:2px solid var(--line);backdrop-filter:blur(4px)}
#hud .in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
#hud .who{font-weight:bold}
.chip{background:var(--g2);border-radius:20px;padding:4px 12px;font-weight:bold;white-space:nowrap}
.meter{flex:1 1 220px;min-width:200px}
.meter .lab{font-size:13px;display:flex;justify-content:space-between}
.meter .bar{height:14px;background:#e5e5e5;border-radius:8px;overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,#3fb56b,#ffcf3f,#e2574c);transition:width .6s}
#hud .tools{display:flex;gap:6px}
#hud .tools button{padding:6px 10px;font-size:15px}
/* 地圖 */
#mapBox{position:relative;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(40,90,50,.18);background:#fff;margin-top:12px;user-select:none}
#mapBox img{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3}
.spot .ic{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--r);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.3);animation:pulse 1.6s infinite}
.spot.done .ic{border-color:var(--g);animation:none}
.spot.lock .ic{border-color:#999;filter:grayscale(1);animation:none;opacity:.8}
.spot .nm{margin-top:3px;background:rgba(255,255,255,.95);border-radius:8px;padding:1px 7px;font-size:13px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.spot .st{font-size:12px;line-height:1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,87,76,.55)}50%{box-shadow:0 0 0 10px rgba(226,87,76,0)}}
.stk{position:absolute;transform:translate(-50%,-50%);font-size:26px;z-index:2;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:pop .5s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.tip{background:#fff;border-radius:14px;padding:10px 14px;margin-top:12px;border-left:6px solid var(--y)}
.micons{display:flex;gap:5px;flex-wrap:wrap;background:#fff8e6;border:2px solid #e6d3a3;border-radius:22px;padding:4px 6px}
.bgrp{position:relative;display:inline-flex;gap:3px;padding:2px;border-radius:20px;background:#f0e6cc}
.bgrp.got{background:linear-gradient(135deg,#ffe27a,#f2b530);box-shadow:0 0 0 2px #e0a020}
.bgrp em{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-style:normal;font-size:12px;line-height:1}
.mi{position:relative;width:36px;height:36px;border-radius:50%;padding:0;background:#e9ecea;border:2px solid #c5cbc7;box-shadow:none;font-size:18px;line-height:1}
.mi span{filter:grayscale(1);opacity:.55}
.mi.done{background:#dff5e5;border-color:var(--g)}
.mi.done span{filter:none;opacity:1}
.mi.lock span{opacity:.7}
.mi:not(.done):not(.lock){border-color:#f2c230;animation:miPulse 1.8s infinite}
@keyframes miPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,194,48,.6)}50%{box-shadow:0 0 0 5px rgba(242,194,48,0)}}
.mi i{position:absolute;right:-4px;bottom:-4px;background:#ffcf3f;color:#5a3d00;border:1.5px solid #fff;border-radius:9px;font-style:normal;font-size:10px;font-weight:bold;padding:0 4px;line-height:14px}
.mi i::before{content:'★'}
@media (max-width:600px){ .mi{width:30px;height:30px;font-size:15px} }
@media (max-width:640px){
  #hud{position:static}
  #hud .in{gap:6px 8px;padding:6px 10px}
  .tl{display:none}
  #hud .tools button{padding:5px 9px;font-size:18px}
  .meter{min-width:140px}
  .micons{padding:3px 4px;gap:3px}
}
.mcard{background:#fff;border-radius:14px;padding:10px 12px;border:2px solid var(--line);cursor:pointer}
.mcard:hover{border-color:var(--g)}
.mcard b{display:block}
.mcard small{color:#5a6d60}
/* 俯視角校園 */
#cv{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;background:#86c96e}
#mini{position:absolute;left:10px;bottom:10px;width:168px;height:132px;border:3px solid #fff8e6;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.35);pointer-events:none;z-index:4}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(36,40,50,.82);color:#fff;border-radius:10px;padding:5px 14px;font-size:14px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:4}
#mapBox #pad{left:auto;right:10px}
.avs canvas{display:block;width:60px;height:60px}
.avs{flex-wrap:wrap}
.avs .avc{display:flex;flex-direction:column;align-items:center;padding:4px 8px}
.avs .avc small{font-size:11px;color:var(--g);font-weight:bold;white-space:nowrap}
/* 紙娃娃 */
.dress{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dprev{flex:0 0 160px;text-align:center;background:linear-gradient(#e8f6ec,#cfe9d6);border-radius:16px;padding:8px}
.dprev canvas{width:150px;height:170px}
.dprev .row button{padding:4px 12px;font-size:15px}
.dopts{flex:1 1 300px;min-width:0}
.drow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #e3e9e5}
.drow b{flex:0 0 42px;font-size:15px}
.dsw{display:flex;flex-wrap:wrap;gap:5px}
.dsw .sw{width:28px;height:28px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c5cbc7}
.dsw .sw.on{box-shadow:0 0 0 3px var(--g)}
.dsw .tx{padding:4px 10px;font-size:14px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:normal}
.dsw .tx.on{border-color:var(--g);background:var(--g2);font-weight:bold}
.dsw .tx.lk{opacity:.55}
@media (max-width:600px){ .dprev{flex-basis:100%} }
@media (max-width:600px){ #mini{width:100px;height:79px} #hint{font-size:12px} }
/* 主角 */
#hero{position:absolute;transform:translate(-50%,-88%);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#hero .hs{font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#hero .hs span{display:inline-block}
#hero.flip .hs span{transform:scaleX(-1)}
#hero.walk .hs{animation:bob .28s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
#hero .hn{font-size:11px;background:#2f7fd1;color:#fff;border-radius:6px;padding:0 6px;font-weight:bold;white-space:nowrap}
#hero .hb{pointer-events:auto;cursor:pointer;background:#fff;border:3px solid var(--y);border-radius:12px;padding:4px 10px;font-weight:bold;font-size:14px;white-space:nowrap;margin-bottom:5px;box-shadow:0 3px 8px rgba(0,0,0,.25);animation:bub .25s}
@keyframes bub{from{opacity:0;margin-bottom:-4px}to{opacity:1;margin-bottom:5px}}
#pad{position:absolute;left:8px;bottom:8px;z-index:6;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;touch-action:none;user-select:none}
#pad button{padding:0;font-size:20px;background:rgba(36,53,43,.72);color:#fff;border-radius:12px;box-shadow:none;touch-action:none}
#pad .act{background:rgba(226,140,40,.9);font-size:15px}
#mapBox.click #hero,#mapBox.click #pad{display:none}
@media (hover:hover) and (pointer:fine){ #pad{display:none} }
#mapBox.walk{cursor:crosshair}
.avs{display:flex;gap:8px;justify-content:center}
.avs button{font-size:30px;background:#fff;border:2px solid var(--line);box-shadow:none;padding:6px 12px}
.avs button.on{border-color:var(--g);background:var(--g2)}
@media (max-width:600px){ #hero .hs{font-size:24px} #pad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)} }
/* 視窗 */
#modal{position:fixed;inset:0;background:rgba(20,40,25,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
#mbox{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:20px 20px 24px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto 0}
#mclose{position:absolute;right:10px;top:10px;background:#eee;color:#555;padding:4px 12px;box-shadow:none}
.mhead{display:flex;align-items:center;gap:10px;padding-right:50px}
.mhead .big{font-size:40px}
.prog{height:8px;background:#eee;border-radius:5px;margin:10px 0 14px;overflow:hidden}
.prog div{height:100%;background:var(--b);transition:width .3s}
.story{background:var(--g2);border-radius:12px;padding:10px 14px;line-height:1.7}
.q{font-size:20px;font-weight:bold;margin:12px 0;line-height:1.5}
.opts{display:grid;gap:8px}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;box-shadow:none;font-weight:normal;font-size:18px;padding:12px 14px}
.opts button.ok{background:#dff5e5;border-color:var(--g);font-weight:bold}
.opts button.no{background:#fde4e1;border-color:var(--r)}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8dc;line-height:1.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
/* 小遊戲 */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.dev{background:#fff7d6;border:3px solid #f2c94c;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);box-shadow:none;font-weight:normal}
.dev .e{font-size:34px;display:block}
.dev.off{background:#e9ecea;border-color:#c5cbc7;filter:grayscale(.8)}
.dev .s{font-size:13px;font-weight:bold}
.timer{font-weight:bold;color:var(--r);font-size:18px}
.items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;min-height:60px}
.item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);box-shadow:none;font-weight:normal;font-size:16px}
.item.sel{border-color:var(--b);background:#e3efff;transform:scale(1.07)}
.item.picked{border-color:var(--g);background:#dff5e5;font-weight:bold}
.item.wrongp{border-color:var(--r);background:#fde4e1}
.item.miss{border-color:#f2a33a;background:#fff1dc}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.bin{background:#5b8a6b;color:#fff;border-radius:12px;padding:10px 4px;text-align:center;font-size:15px}
.bin .e{font-size:28px;display:block}
.bin .n{font-size:12px;opacity:.9}
.roof{display:grid;gap:6px;margin:12px auto;max-width:480px}
.cell{aspect-ratio:1;border-radius:8px;border:2px dashed #b9a98a;background:#efe6d2;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;color:var(--ink);padding:0;box-shadow:none}
.cell.shade{background:#c7cdb9}
.cell.panel{background:#2c4f8c;border:2px solid #1b2f55}
.cell.panel.bad{background:#6b7790}
.stu{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#f7faf8;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.stu .nm{min-width:150px;font-weight:bold}
.stu button{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:6px 9px;font-size:15px;font-weight:normal}
.stu button.on{border-color:var(--b);background:#e3efff;font-weight:bold}
.stu .fb{flex-basis:100%;font-size:14px}
.stars{font-size:44px;letter-spacing:4px;text-align:center}
.res{text-align:center;line-height:1.8;font-size:18px}
.fact{background:#eef6ff;border-radius:12px;padding:10px 14px;margin-top:10px;line-height:1.7;text-align:left;font-size:16px}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.up{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.up .e{font-size:36px}
.up p{font-size:14px;color:#4b5d51;min-height:3em;margin:4px 0}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #eee}
.ach .e{font-size:30px}
.ach.lock{opacity:.4;filter:grayscale(1)}
table.board{width:100%;border-collapse:collapse;font-size:16px}
table.board td,table.board th{padding:6px;border-bottom:1px solid #eee;text-align:center}
table.board tr.me{background:#fff4c2;font-weight:bold}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24352b;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-size:17px;max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* 獎狀 */
#cert{position:fixed;inset:0;background:#fff;z-index:80;overflow:auto;padding:20px}
.certIn{max-width:800px;margin:0 auto;border:12px double #2f9e57;padding:40px 30px;text-align:center;font-size:22px;line-height:1.9}
.certIn h1{font-size:48px;color:#2f9e57;letter-spacing:12px}
@media print{ #cert .row{display:none} #cert{position:static;padding:0} body>*:not(#cert){display:none!important} }
@media (max-width:600px){
  .spot .ic{width:34px;height:34px;font-size:18px;border-width:2px}
  .spot .nm{font-size:11px;padding:0 4px}
  .stk{font-size:18px}
  .q{font-size:18px}
  .opts button{font-size:16px}
  #start h1{font-size:26px}
}
</style>
</head>
<body>

<!-- 開始畫面 -->
<div id="start">
  <div style="font-size:60px">🌏🌱</div>
  <h1>淨零綠校園大作戰</h1>
  <div class="sub">校園裡出現了好多 ⚠️「高碳排熱點」！<br>成為淨零小隊長，完成任務、升級校園，讓學校達成淨零！</div>
  <div class="field"><label>班級（例如 501）</label><input id="inCls" inputmode="numeric" maxlength="4" placeholder="三或四位數字"></div>
  <div class="field"><label>暱稱（會顯示在排行榜，請勿用真實姓名）</label><input id="inName" maxlength="8" placeholder="最多 8 個字"></div>
  <div class="field"><label>挑戰難度</label>
    <div class="lvbtns">
      <button data-lv="1">🌱 小樹苗<br><small>1～2 年級</small></button>
      <button data-lv="2">🌿 小樹<br><small>3～4 年級</small></button>
      <button data-lv="3">🌳 大樹<br><small>5～6 年級</small></button>
    </div>
  </div>
  <div class="field"><label>選擇你的角色</label>
    <div class="avs"><button data-av="0" class="on"><canvas width="72" height="72"></canvas></button><button data-av="1"><canvas width="72" height="72"></canvas></button><button data-av="2"><canvas width="72" height="72"></canvas></button><button data-av="3"><canvas width="72" height="72"></canvas></button><button data-av="custom" class="avc"><canvas width="72" height="72"></canvas><small>🎨 自己打扮</small></button></div>
  </div>
  <div class="err" id="startErr"></div>
  <div class="row"><button id="btnGo" style="font-size:20px;padding:12px 30px">出發！</button></div>
  <div class="row" id="contRow"></div>
  <div class="row"><button class="ghost" id="btnGuest">👀 訪客模式</button></div>
  <div style="color:#5a6d60;font-size:14px">訪客不用輸入班級，選好難度就能玩；成績不上排行榜，關掉分頁後進度就不保留。</div>
</div>

<!-- 遊戲主畫面 -->
<div id="game" class="hidden">
  <div id="hud"><div class="in">
    <span class="who" id="hWho"></span>
    <span class="chip" title="綠幣：可以兌換校園升級">💰 <span id="hCoin">0</span></span>
    <span class="chip" title="總分">⭐ <span id="hScore">0</span> 分</span>
    <div class="meter">
      <div class="lab"><span>🏭 校園碳排指數</span><b id="hIdx">100</b></div>
      <div class="bar"><div class="fill" id="hBar" style="width:100%"></div></div>
    </div>
    <div class="micons" id="mIcons"></div>
    <div class="tools">
      <button class="ghost" id="tUp" title="升級">🛠️<span class="tl"> 升級</span></button>
      <button class="ghost" id="tAch" title="標章">🏅<span class="tl"> 標章</span></button>
      <button class="ghost" id="tHid" title="隱藏任務">🎁<span class="tl"> 隱藏</span></button>
      <button class="ghost" id="tDress" title="紙娃娃換裝">👕<span class="tl"> 換裝</span></button>
      <button class="ghost" id="tBoard" title="排行榜">🏆<span class="tl"> 排行</span></button>
      <button class="ghost" id="tHelp">❓</button>
    </div>
  </div></div>
  <div class="wrap">
    <div id="mapBox">
      <canvas id="cv" width="800" height="576"></canvas>
      <canvas id="mini" width="168" height="132"></canvas>
      <div id="hint"></div>
      <div id="pad">
        <span></span><button data-k="up">▲</button><span></span>
        <button data-k="left">◀</button><button class="act" id="padA">說話</button><button data-k="right">▶</button>
        <span></span><button data-k="down">▼</button><span></span>
      </div>
    </div>
    <div class="tip" id="tipBox"></div>
  </div>
</div>

<div id="modal" class="hidden"><div id="mbox"><button id="mclose">✕</button><div id="mbody"></div></div></div>
<div id="cert" class="hidden"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   ★ 老師可修改區 ★
   - SCHOOL_NAME：獎狀上的校名
   - SCRIPT_URL：排行榜 Google Apps Script 網址（留空＝不使用排行榜）
   - SPOTS：任務 NPC（tx、ty 是地圖格子座標，npc 是人物名字）
   - Q：題庫。第一個選項是正確答案，遊戲會自動打亂順序。
        lv 是適用的最低難度：1＝小樹苗、2＝小樹、3＝大樹
   ===================================================================== */
const SCHOOL_NAME = '我們的學校';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby33riswfEYn9V-YvzRGmFQZjk1UCKfDXJriBz7vZ8VEL7pBRL3NV4bWuX8DislhAYD/exec';

/* ---------------- 工具 ---------------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function r1(n){ return Math.round(n*10)/10; }
function fmtTime(s){ s=Math.round(s||0); const m=Math.floor(s/60); return m+' 分 '+(s%60)+' 秒'; }
let AC=null;
function beep(ok){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime; o.type='triangle';
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+.1); } else { o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(170,t+.12); }
    g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.start(t); o.stop(t+.32);
  }catch(e){}
}

function whoText(){ return S.guest ? '👀 訪客'+(S.name!=='訪客'?' '+S.name:'') : S.cls+' '+S.name; }

/* ---------------- 計分 ---------------- */
function missionPts(){ return MIDS.reduce((s,m)=>s+((S.best[m]&&S.best[m].pts)||0),0); }
function finalPts(){ return (S.best.fin&&S.best.fin.pts)||0; }
function totalScore(){ return missionPts()+finalPts()+hqDoneCount()*20; }   // 隱藏任務每個 20 分
function doneCount(){ return MIDS.filter(m=>S.best[m]&&S.best[m].stars>0).length; }
function hasBadge(bd){ return bd.ms.every(m=>S.best[m]&&S.best[m].stars>0); }
function badgeCount(){ return BADGES.filter(hasBadge).length; }
function upCount(id){ return S.up[id]||0; }
function carbonIdx(){
  let v=100;
  MIDS.forEach(m=>{ if(S.best[m]) v-=S.best[m].stars*2; });
  v -= Math.round(finalPts()/20);
  UPGRADES.forEach(u=>{ v-=u.cut*upCount(u.id); });
  return Math.max(0,v);
}
function starsOf(r){ return r>=0.9?3 : r>=0.6?2 : r>=0.4?1 : 0; }

function pickQ(pool,n){
  const ok=pool.filter(q=>q.lv<=S.lv);
  const same=shuffle(ok.filter(q=>q.lv===S.lv)), other=shuffle(ok.filter(q=>q.lv!==S.lv));
  return same.concat(other).slice(0,n);
}
function buildSteps(id){
  const L=S.lv, nq = L===1?2:3;
  switch(id){
    case 'm1': return [stepToggle(), ...qSteps(pickQ(Q.m1,nq))];
    case 'm2': return [stepSort(), ...qSteps(pickQ(Q.m2,2))];
    case 'm3': return [stepTransport(), ...qSteps(pickQ(Q.m3,L===1?1:2))];
    case 'm4': return [stepSolar(), ...qSteps(pickQ(Q.m4,nq))];
    case 'm5': return [stepPick('tree'), ...qSteps(pickQ(Q.m5,nq))];
    case 'm6': return [stepPick('comp'), ...qSteps(pickQ(Q.m6,nq))];
    case 'm7': return [...qSteps(pickPairs(L===1?3:4),true), ...qSteps(pickQ(Q.m7,L===1?1:2))];
    case 'm8': return [stepPick('water'), ...qSteps(pickQ(Q.m8,nq))];
    case 'm9': return [stepPick('eco'), ...qSteps(pickQ(Q.m9,nq))];
    case 'm10': return [stepPick('rain'), ...qSteps(pickQ(Q.m10,nq))];
    case 'fin': {
      let all=[]; Object.keys(Q).forEach(k=>all=all.concat(Q[k].map(q=>Object.assign({},q))));
      return qSteps(pickQ(all,10));
    }
  }
}
function openMission(id){
  if(id==='fin' && doneCount()<NM){ toast('🔒 先完成 '+NM+' 個熱點任務、拿到 5 枚校園標章，才能挑戰淨零大會考喔！'); return; }

  openModal(`<div class="mhead"><span class="big">${p.ic}</span><div><h2>${p.title}</h2><div>📍 ${p.name}</div></div></div>
    <div class="story" style="margin-top:12px"><b>${p.npc}：</b>「${INTRO[id]}」</div>
    ${badgeOf(id)?`<p style="text-align:center;margin:10px 0 0">🏅 這是「<b>${badgeOf(id).name}</b>」的任務（${badgeOf(id).ms.map(m=>SPOTS[m].title).join('＋')}）</p>`:''}
    ${b?`<p style="text-align:center">目前最佳：${'⭐'.repeat(b.stars)||'—'}　${b.pts} 分</p>`:''}
    <div class="row"><button id="goM" style="font-size:20px">${b?'再挑戰一次':'開始任務'}</button></div>`);
  $('#goM').onclick=()=>{
    curRun={id, steps:buildSteps(id), i:0, got:0, total:0, finished:false, facts:[]};
    nextStep();
  };
}
function nextStep(){
  const R=curRun; if(!R) return;
  if(R.i>=R.steps.length) return finishMission();
  const st=R.steps[R.i];
  const pct=Math.round(R.i/R.steps.length*100);
  $('#mbody').innerHTML=`<div class="mhead"><span class="big">${SPOTS[R.id].ic}</span><h3>${SPOTS[R.id].title}</h3></div><div class="prog"><div style="width:${pct}%"></div></div><div id="stepBox"></div>`;
  $('#modal').scrollTop=0;
  st($('#stepBox'), (got,total,fact)=>{ R.got+=got; R.total+=total; if(fact) R.facts.push(fact); R.i++; });
}
function contBtn(box,label){
  const row=document.createElement('div'); row.className='row';
  const b=document.createElement('button'); b.textContent=label||'下一步 ➜'; b.onclick=nextStep; row.appendChild(b); box.appendChild(row);
  b.focus();
}

/* 選擇題 */
function qSteps(list,isPair){
  return list.map(q=>(box,done)=>{
    const opts=shuffle(q.a.map((t,i)=>({t,ok:i===0})));
    box.innerHTML=`<div class="q">${isPair?'🥗 ':'❓ '}${esc(q.q)}</div><div class="opts"></div>`;
    const O=box.querySelector('.opts');
    opts.forEach((o,k)=>{
      const b=document.createElement('button'); b.innerHTML=`<b>${k+1}.</b> ${esc(o.t)}`;
      b.onclick=()=>{
        O.querySelectorAll('button').forEach((x,j)=>{ x.disabled=true; x.style.opacity=1; if(opts[j].ok) x.classList.add('ok'); });
        if(!o.ok) b.classList.add('no');
        beep(o.ok);
        const e=document.createElement('div'); e.className='exp'; e.innerHTML=(o.ok?'✅ 答對了！':'❌ 答錯了，正確答案已標示。')+'<br>💡 '+esc(q.exp); box.appendChild(e);
        done(o.ok?1:0,1); contBtn(box);
      };
      O.appendChild(b);
    });
  });
}

/* 小遊戲 1：關電小偵探 */
function stepToggle(){
  return (box,done)=>{
    const L=S.lv;
    let devs=[
      {e:'💡',n:'前排電燈',need:false},{e:'💡',n:'後排電燈',need:false},{e:'🌀',n:'電風扇',need:false},
      {e:'❄️',n:'冷氣',need:false},{e:'💻',n:'電腦',need:false},{e:'📽️',n:'投影機',need:false}
    ];
    if(L>=2) devs.push({e:'🔌',n:'平板充電車（已充飽）',need:false},{e:'🐟',n:'魚缸打氣機',need:true});
    if(L>=3) devs.push({e:'💡',n:'走廊電燈',need:false},{e:'🌀',n:'吊扇',need:false});
    devs=shuffle(devs).map(d=>Object.assign(d,{on:true}));
    let left = L===1?30:L===2?25:22, ended=false;
    box.innerHTML=`<div class="story">🏃 全班要去操場上體育課，教室 40 分鐘沒有人！點一下電器可以開／關，<b>把不需要的關掉</b>${L>=2?'（但有一樣東西不能關喔！）':''}。</div>
      <p style="text-align:center">剩下 <span class="timer" id="tLeft">${left}</span> 秒</p><div class="devs"></div><div class="row"><button id="tOk">檢查完畢 ✔</button></div>`;
    const D=box.querySelector('.devs');
    devs.forEach(d=>{
      const b=document.createElement('button'); b.className='dev';
      const draw=()=>{ b.classList.toggle('off',!d.on); b.innerHTML=`<span class="e">${d.e}</span>${d.n}<br><span class="s">${d.on?'🟢 開著':'⚫ 關閉'}</span>`; };
      b.onclick=()=>{ if(ended) return; d.on=!d.on; draw(); }; draw(); D.appendChild(b);
    });
    const end=()=>{
      if(ended) return; ended=true; clearInterval(gameTimer);
      const ok=devs.filter(d=>d.on===d.need).length;
      const fish=devs.find(d=>d.need);
      D.querySelectorAll('.dev').forEach((b,i)=>{ b.style.outline = devs[i].on===devs[i].need ? '3px solid #2f9e57':'3px solid #e2574c'; });
      box.querySelector('#tOk').remove();
      // 燈 0.48kW＋電扇 0.12＋冷氣 1.5＋電腦 0.15＋投影機 0.25 ≈ 2.5kW，40 分鐘
      const kwh = r1(2.5*40/60);
      let msg=`<div class="exp">${ok===devs.length?'🎉 全部正確！':'有 '+(devs.length-ok)+' 個沒處理好（紅框）。'}<br>`;
      if(fish) msg+= fish.on?'🐟 魚缸打氣機不能關，魚需要氧氣，你做得很好！<br>':'🐟 糟糕！魚缸打氣機關掉，魚會缺氧！節電也要注意安全和生命喔。<br>';
      msg+= L>=2?`💡 像這樣下課隨手關電，一間教室 40 分鐘大約可省 ${kwh} 度電；全校 30 間教室一起做，就是約 ${r1(kwh*30)} 度電，少排放約 ${r1(kwh*30*EF.elec)} 公斤二氧化碳！`:'💡 人離開就關電，是最簡單的減碳方法！';
      box.insertAdjacentHTML('beforeend',msg+'</div>');
      beep(ok===devs.length);
      done(Math.round(ok/devs.length*5),5); contBtn(box);
    };
    box.querySelector('#tOk').onclick=end;
    clearInterval(gameTimer);
    gameTimer=setInterval(()=>{ left--; const t=box.querySelector('#tLeft'); if(t) t.textContent=left; if(left<=0) end(); },1000);
  };
}

const BINS=[

];
const TRASH=[
  {e:'📝',n:'舊考卷',b:'paper'},{e:'📦',n:'紙箱（壓扁）',b:'paper'},{e:'🍶',n:'寶特瓶（已倒空）',b:'plastic'},
  {e:'🥤',n:'洗乾淨的塑膠杯',b:'plastic'},{e:'🥫',n:'鋁罐',b:'metal'},{e:'🥫',n:'鐵罐頭（洗淨）',b:'metal'},
  {e:'🍾',n:'玻璃瓶',b:'glass'},{e:'🍌',n:'香蕉皮',b:'food'},{e:'🍚',n:'吃剩的飯菜',b:'food'},
  {e:'🧻',n:'用過的衛生紙',b:'trash'},{e:'🍬',n:'嚼過的口香糖',b:'trash'},{e:'🖊️',n:'壞掉的原子筆',b:'trash'}
];
function stepSort(){
  return (box,done)=>{
    const n = S.lv===1?6:S.lv===2?9:12;
    // 每個桶子至少一件
    let pool=shuffle(TRASH), list=[];
    BINS.forEach(b=>{ const i=pool.findIndex(t=>t.b===b.id); list.push(pool.splice(i,1)[0]); });
    list=shuffle(list.concat(pool.slice(0,n-6)));
    let sel=null, ok=0, cnt=0;
    box.innerHTML=`<div class="story">先點一個垃圾，再點它應該去的桶子。</div><div class="items"></div><div class="bins"></div><div id="sFb" class="exp" style="display:none"></div>`;
    const I=box.querySelector('.items'), B=box.querySelector('.bins'), F=box.querySelector('#sFb');
    list.forEach(t=>{
      const b=document.createElement('button'); b.className='item'; b.textContent=t.e+' '+t.n;
      b.onclick=()=>{ I.querySelectorAll('.item').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel={t,b}; };
      I.appendChild(b);
    });
    BINS.forEach(bn=>{
      const d=document.createElement('button'); d.className='bin'; d.innerHTML=`<span class="e">${bn.e}</span>${bn.n}<div class="n">0</div>`; d._c=0;
      d.onclick=()=>{
        if(!sel){ toast('先點一個垃圾喔！'); return; }
        const right = sel.t.b===bn.id; cnt++; if(right) ok++;
        beep(right);
        const rb=BINS.find(x=>x.id===sel.t.b);
        F.style.display='block';
        F.innerHTML = right ? `✅ ${sel.t.n} → ${bn.n}，正確！` : `❌ ${sel.t.n} 應該丟到「${rb.n}」才對。`;
        sel.b.remove(); sel=null; d._c++; d.querySelector('.n').textContent=d._c;
        if(cnt===list.length){
          F.innerHTML += `<br>🎯 分類正確 ${ok} / ${list.length} 件。<br>💡 資源回收再製，比從原料重新製造省下很多能源，也能減少焚化垃圾產生的二氧化碳。`;
          done(Math.round(ok/list.length*5),5); contBtn(box);
        }
      };
      B.appendChild(d);
    });
  };
}

/* 小遊戲 3：綠色上學路 */
const MODES=[
  {id:'walk',e:'🚶',n:'走路',f:0},{id:'bike',e:'🚲',n:'腳踏車',f:0},{id:'bus',e:'🚌',n:'公車',f:0.04},
  {id:'pool',e:'🚗👫',n:'汽車共乘',f:0.06},{id:'moto',e:'🛵',n:'機車載',f:0.05},{id:'car',e:'🚗',n:'汽車單獨接送',f:0.17}
];
function stepTransport(){
  return (box,done)=>{
    const L=S.lv;
    let stu=[{n:'小安',d:0.6},{n:'小翠',d:1.5},{n:'阿耘',d:3},{n:'小樺',d:7},{n:'阿榕',d:12}];
    if(L===1) stu=[stu[0],stu[2],stu[4]];
    const can=(m,d)=> m==='walk'?d<=2 : m==='bike'?d<=5 : true;
    const pick={};
    box.innerHTML=`<div class="story">幫每位同學選一種<b>最低碳、又做得到</b>的上學方式。${L>=2?'（走路適合 2 公里內，腳踏車適合 5 公里內）':'（家太遠的話，走路會走不到喔！）'}</div><div id="stuL"></div><div class="row"><button id="trOk" disabled>送出規劃</button></div>`;
    const W=box.querySelector('#stuL');
    stu.forEach((s,k)=>{
      const r=document.createElement('div'); r.className='stu';
      r.innerHTML=`<span class="nm">🧒 ${s.n}（家離學校 ${s.d} 公里）</span>`;
      MODES.forEach(m=>{
        const b=document.createElement('button'); b.textContent=m.e+' '+m.n;
        b.onclick=()=>{ pick[k]=m.id; r.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); box.querySelector('#trOk').disabled = Object.keys(pick).length<stu.length; };
        r.appendChild(b);
      });
      r.insertAdjacentHTML('beforeend','<div class="fb"></div>');
      W.appendChild(r);
    });
    box.querySelector('#trOk').onclick=()=>{
      box.querySelector('#trOk').remove();
      let ok=0, kg=0, kgCar=0;
      stu.forEach((s,k)=>{
        const m=MODES.find(x=>x.id===pick[k]);
        const zeroOk = can('walk',s.d)||can('bike',s.d);
        const best = zeroOk ? ['walk','bike'].filter(x=>can(x,s.d)) : ['bus','pool'];
        const fb=W.children[k].querySelector('.fb');
        W.children[k].querySelectorAll('button').forEach(b=>b.disabled=true);

        else if(best.includes(m.id)){ ok++; fb.innerHTML=`✅ 很棒的選擇！${L>=2?'每天來回約 '+r1(s.d*2*m.f*10)/10+' 公斤 CO2':''}`; }
        else { fb.innerHTML=`🟡 可以，但還有更低碳的：${best.map(x=>MODES.find(y=>y.id===x).n).join('或')}${L>=2?'（你的選擇每天來回約 '+r1(s.d*2*m.f*10)/10+' 公斤 CO2）':''}`; }
      });
      beep(ok===stu.length);
      const save1=Math.max(0,kgCar-kg);
      box.insertAdjacentHTML('beforeend',`<div class="exp">🎯 選到最佳方式：${ok} / ${stu.length} 位同學。<br>${L>=2?`💡 如果大家都開車單獨接送，每天來回約排放 ${r1(kgCar)} 公斤 CO2；照你的規劃約 ${r1(kg)} 公斤，每天少排 ${r1(save1)} 公斤，一學期（約 100 天）就是 ${Math.round(save1*100)} 公斤！`:'💡 走路、騎腳踏車上學，不排放二氧化碳，還能運動身體！'}<br><small>（排放係數為教學用概估：汽車約 0.17、機車約 0.05、公車約 0.04 公斤／每人每公里）</small></div>`);
      done(Math.round(ok/stu.length*5),5); contBtn(box);
    };
  };
}

/* 小遊戲 4：太陽能 */
function stepSolar(){
  return (box,done)=>{
    const L=S.lv, cols=6, rows=4, budget=L===1?6:8;
    // 遮蔭：左側大樹、中間水塔
    const shade=new Set(['0,0','0,1','1,0','0,2','3,1','3,2','5,3','4,3']);
    const placed=new Set();
    box.innerHTML=`<div class="story">屋頂上有大樹的影子 🌳 和水塔 🛢️ 會擋住陽光。請放 <b>${budget}</b> 片太陽能板，放在陽光最多的地方！（再點一次可以移除）</div>
      <p style="text-align:center">已放：<b id="pc">0</b> / ${budget}</p><div class="roof" style="grid-template-columns:repeat(${cols},1fr)"></div><div class="row"><button id="sOk" disabled>開始發電 ⚡</button></div>`;
    const R=box.querySelector('.roof');
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const k=x+','+y, sh=shade.has(k);
      const c=document.createElement('button'); c.className='cell'+(sh?' shade':'');
      c.textContent = sh ? (k==='3,1'||k==='3,2'?'🛢️':'🌳') : '☀️';
      c.onclick=()=>{
        if(c._lock) return;
        if(placed.has(k)){ placed.delete(k); c.classList.remove('panel'); c.textContent= sh ? (k==='3,1'||k==='3,2'?'🛢️':'🌳') : '☀️'; }
        else { if(placed.size>=budget){ toast('太陽能板用完了，點已放的板子可以移除'); return; } placed.add(k); c.classList.add('panel'); c.textContent='🔷'; }
        box.querySelector('#pc').textContent=placed.size; box.querySelector('#sOk').disabled=placed.size<budget;
      };
      c._k=k; R.appendChild(c);
    }
    box.querySelector('#sOk').onclick=()=>{
      box.querySelector('#sOk').remove();
      let good=0; R.querySelectorAll('.cell').forEach(c=>{ c._lock=true; if(placed.has(c._k)){ if(shade.has(c._k)) c.classList.add('bad'); else good++; } });
      const kwhDay = good*EF.panelDay + (budget-good)*EF.panelDay*0.25;
      const kgYear = kwhDay*365*EF.elec;
      beep(good===budget);
      box.insertAdjacentHTML('beforeend',`<div class="exp">🎯 照得到陽光的板子：${good} / ${budget} 片。${good<budget?'被遮住的板子（灰色）發電量只剩約四分之一。':''}<br>${L>=2?`⚡ 這片屋頂一天約發 ${r1(kwhDay)} 度電，一年約 ${Math.round(kwhDay*365)} 度，可以少排放約 <b>${Math.round(kgYear)} 公斤</b>二氧化碳，相當於 ${Math.round(kgYear/EF.tree)} 棵大樹一年的吸收量！`:'⚡ 太陽能發電不用燒煤和天然氣，乾淨又不排碳！'}</div>`);
      done(Math.round(good/budget*5),5); contBtn(box);
    };
  };
}

/* 任務結算 */
function finishMission(){
  const R=curRun; R.finished=true;
  const ratio=R.total?R.got/R.total:0;
  const isFin=R.id==='fin';
  const pts=Math.round(ratio*(isFin?200:100));
  const stars=starsOf(ratio);
  const old=S.best[R.id]||{pts:0,stars:0};
  const gain = stars>0 ? Math.max(0, Math.floor(pts/5)-Math.floor(old.pts/5)) : 0;
  const idxBefore=carbonIdx();
  if(stars>0 && (pts>old.pts || stars>old.stars)) S.best[R.id]={pts:Math.max(pts,old.pts),stars:Math.max(stars,old.stars)};
  S.coins+=gain;
  const idxAfter=carbonIdx();
  save();
  const firstFin = isFin && stars>0 && !old.stars;
  $('#mbody').innerHTML=`<div class="res">
    <h2>${stars>0?'任務完成！':'差一點點！'}</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div>得分 <b>${pts}</b> / ${isFin?200:100}　（答對率 ${Math.round(ratio*100)}%）</div>
    ${stars>0?`<div>💰 獲得綠幣 <b>${gain}</b>${gain===0&&old.pts?'（要超過之前的最高分才會再拿到綠幣）':''}</div>
    <div>🏭 校園碳排指數 ${idxBefore} ➜ <b>${idxAfter}</b></div>`:'<div>答對率要達 40% 才算過關，再試一次吧！</div>'}
  </div>
  <div class="row">${stars>0?'<button id="rUp">🛠️ 去升級校園</button>':''}<button class="ghost" id="rMap">回到地圖</button>${stars<3?'<button class="ghost" id="rAgain">再挑戰</button>':''}${firstFin?'<button id="rCert">📜 領取獎狀</button>':''}</div>`;
  const id=R.id; curRun=null;
  onClose=()=>{ renderAll(); submitScore(); };
  if($('#rUp')) $('#rUp').onclick=()=>{ onClose=null; renderAll(); submitScore(); showUpgrades(); };
  $('#rMap').onclick=closeModal;
  if($('#rAgain')) $('#rAgain').onclick=()=>{ renderAll(); openMission(id); };
  if($('#rCert')) $('#rCert').onclick=()=>{ closeModal(); showCert(); };
  beep(stars>0);
}

  const idx=carbonIdx();

  UPGRADES.forEach(u=>{

const COURTS=BLD.filter(b=>b.k==='dome'||b.k==='gym');

function updateCars(dt){

    for(const o of CARS){ // 保持車距
      if(o===c||o.lane!==c.lane) continue;
      if(c.dir>0&&o.x>c.x&&nx+c.len+16>o.x) nx=Math.min(nx,o.x-c.len-16);
      if(c.dir<0&&o.x<c.x&&nx<o.x+o.len+16) nx=Math.max(nx,o.x+o.len+16);

    if(c.dir>0) c.x=Math.max(c.x,nx); else c.x=Math.min(c.x,nx);
    if(c.dir>0&&c.x>MW*TS+60){ const minX=Math.min(...CARS.filter(o=>o.lane===c.lane&&o!==c).map(o=>o.x)); c.x=Math.min(-c.len-40,minX-c.len-60-Math.random()*220); }

    if(c.school){ g.fillStyle='#2b2233'; g.fillRect(x+4,y+H/2-1,L-8,2); rr(g,x+L/2-15,y+H/2-6,30,12,3,'#fff'); g.fillStyle='#c0392b'; g.font='bold 9px "Microsoft JhengHei",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('校　車',x+L/2,y+H/2+.5); }
    else { rr(g,x+L/2-12,y+H/2-6,24,12,3,'#fff'); g.fillStyle='#2e7d4f'; g.font='bold 9px "Microsoft JhengHei",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('公車',x+L/2,y+H/2+.5); }
  } else {

    g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(f?x+L-14:x+10,y+7,2,5);

/* ---------------- 主角與移動 ---------------- */
const PL={x:17,y:33,px:17*TS,py:33*TS,dir:'up',moving:false,step:0,anim:0,look:LOOKS[0],path:null,goal:null};
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function occupied(x,y,except){
  if(except!==PL && PL.x===x && PL.y===y) return true;
  return NPCS.some(n=>n!==except && n.x===x && n.y===y);
}
// 上學時間：校門（北門、南大門）和圍牆外都不能去
const isGate=(x,y)=>tileAt(x,y)==='g'||y>=35;
let gateWarnT=-1e9;
function gateWarn(){ const now=performance.now(); if(now-gateWarnT>2500){ gateWarnT=now; toast('🏫 現在是上課時間，不可以離開校園喔！'); } }
function passable(x,y){ return !SOLID.has(tileAt(x,y)) && !UPS.has(x+','+y) && !isGate(x,y); }
function npcAt(x,y){ return NPCS.find(n=>n.x===x&&n.y===y); }
// 司令台是高台：只能從樓梯（U）上下，不能從旁邊跳下去
function canMove(fx,fy,tx,ty){ const a=tileAt(fx,fy), b=tileAt(tx,ty); if((a==='Q')!==(b==='Q')) return a==='U'||b==='U'; return true; }
function tryStep(dir){
  PL.dir=dir; const [dx,dy]=DIRS[dir], nx=PL.x+dx, ny=PL.y+dy;
  if(isGate(nx,ny)){ gateWarn(); return false; }
  if(!passable(nx,ny) || !canMove(PL.x,PL.y,nx,ny) || occupied(nx,ny,PL)) return false;
  PL.x=nx; PL.y=ny; PL.moving=true; return true;
}
function bfs(sx,sy,isGoal){
  const prev=new Int32Array(MW*MH).fill(-2), q=[sy*MW+sx]; prev[q[0]]=-1;
  for(let h=0;h<q.length;h++){ const c=q[h], x=c%MW, y=(c/MW)|0;
    if(isGoal(x,y)){ const path=[]; for(let k=c;prev[k]!==-1;k=prev[k]) path.push([k%MW,(k/MW)|0]); return path.reverse(); }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=x+dx, Y=y+dy; if(X<0||Y<0||X>=MW||Y>=MH) continue; const n=Y*MW+X;
      if(prev[n]!==-2 || !passable(X,Y) || !canMove(x,y,X,Y) || (occupied(X,Y,PL) && !isGoal(X,Y))) continue; prev[n]=c; q.push(n); } }
  return null;
}
function dirTo(a,b){ const dx=b.x-a.x, dy=b.y-a.y; return Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); }
function walkToNpc(n){
  const adj=(x,y)=>Math.abs(x-n.x)+Math.abs(y-n.y)===1;
  if(adj(PL.x,PL.y)){ PL.dir=dirTo(PL,n); talkTo(n); return; }
  const p=bfs(PL.x,PL.y,(x,y)=>adj(x,y)&&!occupied(x,y,PL));
  if(p){ PL.path=p; PL.goal=n; } else toast('走不到那裡喔！');
}
function walkToTile(tx,ty){
  if(isGate(tx,ty)){ gateWarn(); return; }
  const p=bfs(PL.x,PL.y,(x,y)=>x===tx&&y===ty);
  if(p){ PL.path=p; PL.goal=null; } else toast('那裡走不過去喔！');
}
function stepPath(){
  if(!PL.path||!PL.path.length){ PL.path=null; if(PL.goal){ const n=PL.goal; PL.goal=null; if(Math.abs(PL.x-n.x)+Math.abs(PL.y-n.y)===1){ PL.dir=dirTo(PL,n); talkTo(n); } } return; }
  const [nx,ny]=PL.path[0]; const dir=nx>PL.x?'right':nx<PL.x?'left':ny>PL.y?'down':'up';
  if(tryStep(dir)) PL.path.shift(); else { PL.path=null; PL.goal=null; }
}
function facingNpc(){ const [dx,dy]=DIRS[PL.dir]; return npcAt(PL.x+dx,PL.y+dy); }
function worldActive(){ return S && !$('#game').classList.contains('hidden') && $('#modal').classList.contains('hidden') && $('#cert').classList.contains('hidden'); }
let bubble=null;
function talkTo(n){
  held.clear(); PL.path=null;
  n.dir=dirTo(n,PL); if(n.wander){ n.wt=3; }
  if(hqTalk(n)) return;
  if(n.mission){ openMission(n.mission); return; }
  bubble={n, text:n.chat, t:3};
}
function interactKey(){
  if(!worldActive()) return; const n=facingNpc(); if(n){ talkTo(n); return; }
  const [dx,dy]=DIRS[PL.dir]; if(tileAt(PL.x+dx,PL.y+dy)==='K') bubble={n:{px:11.5*TS,py:22*TS-24}, text:'小孔廟：紀念至聖先師孔子，要愛護古蹟喔 🙏', t:4};
}
const held=new Set(), order=[];
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
document.addEventListener('keydown',e=>{
  if(!worldActive()) return;
  const k=KEYS[e.key];
  if(k){ e.preventDefault(); if(!held.has(k)){ held.add(k); order.push(k); } PL.path=null; PL.goal=null; }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); interactKey(); }
});
document.addEventListener('keyup',e=>{ const k=KEYS[e.key]; if(k) held.delete(k); });
window.addEventListener('blur',()=>held.clear());
function curDir(){ for(let i=order.length-1;i>=0;i--) if(held.has(order[i])) return order[i]; order.length=0; return null; }
// 觸控方向鍵
document.querySelectorAll('#pad [data-k]').forEach(b=>{ const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); held.add(k); order.push(k); PL.path=null; PL.goal=null; try{b.setPointerCapture(e.pointerId);}catch(_){} });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>held.delete(k))); });
$('#padA').addEventListener('pointerdown',e=>{ e.preventDefault(); interactKey(); });
// 點地圖移動
const cam={x:0,y:0};
cv.addEventListener('click',e=>{
  if(!worldActive()) return;
  const r=cv.getBoundingClientRect(), wx=(e.clientX-r.left)/r.width*VW+cam.x, wy=(e.clientY-r.top)/r.height*VH+cam.y;
  const tx=Math.floor(wx/TS), ty=Math.floor(wy/TS);
  const n=NPCS.find(n=>Math.abs(n.px+16-wx)<20 && wy>n.py-18 && wy<n.py+34) || npcAt(tx,ty);
  if(n) walkToNpc(n); else walkToTile(tx,ty);
});

const HQ={

};
function hqInit(){ S.hq=Object.assign({litter:{},eco:{},talk:{},cup:0,visit:{},done:{},seen:{}},S.hq||{}); }
function hqProg(k){ const h=S.hq;
  if(k==='litter') return [Object.keys(h.litter).length,LITTER.length];
  if(k==='eco') return [Object.keys(h.eco).length,ANIMALS.length];
  if(k==='talk') return [Object.keys(h.talk).length,4];
  if(k==='cup') return [h.cup,2];
  if(k==='visit') return [Object.keys(h.visit).length,Object.keys(VISITS).length]; }
function hqSeen(k){ if(!S.hq.seen[k]){ S.hq.seen[k]=1; save(); toast(`🔍 發現隱藏任務：${HQ[k].ic}「${HQ[k].name}」！`); } }
function hqCheck(k){

  S.hq.done[k]=1; S.coins+=HQ_COIN; save(); beep(true);
  setTimeout(()=>toast(`🎉 完成隱藏任務「${HQ[k].name}」！+${HQ_PT} 分、+${HQ_COIN} 綠幣，解鎖造型「${ACC[HQ[k].acc].name}」`),900);
  renderAll(); submitScore();
}
function hqStep(){ // 每走到一格檢查一次
  if(!S) return; hqInit(); const h=S.hq, x=PL.x, y=PL.y;
  const li=LITTER.findIndex(([lx,ly])=>lx===x&&ly===y);
  if(li>=0&&!h.litter[li]){ hqSeen('litter'); h.litter[li]=1; save(); const [a,b]=hqProg('litter'); bubble={n:PL,text:`撿起垃圾 ${LITTER[li][2]}（${a}/${b}）`,t:2}; hqCheck('litter'); }
  for(const an of ANIMALS) if(!h.eco[an.k]&&Math.abs(an.x-x)+Math.abs(an.y-y)<=1){ hqSeen('eco'); h.eco[an.k]=1; save(); const [a,b]=hqProg('eco'); bubble={n:PL,text:`${an.e} 發現${an.name}！（${a}/${b}）`,t:3}; setTimeout(()=>toast('💡 '+an.fact),300); hqCheck('eco'); }
  if(h.cup===0&&x===CUP_AT[0]&&y===CUP_AT[1]){ hqSeen('cup'); h.cup=1; save(); bubble={n:PL,text:'撿到一個環保杯🥤 上面寫著「廚房」……',t:3}; }
  for(const [k,v] of Object.entries(VISITS)) if(!h.visit[k]&&v.at(x,y)){ h.visit[k]=1; save(); if(Object.keys(h.visit).length>=2){ hqSeen('visit'); const [a,b]=hqProg('visit'); toast(`🗺️ 探險：${v.name}（${a}/${b}）`); } hqCheck('visit'); }
}
function hqTalk(n){ // 和人物說話時的隱藏任務判定；回傳 true 表示這次對話被隱藏任務使用
  if(!S) return false; hqInit(); const h=S.hq;
  if(n.wander&&!h.talk[n.id]){ h.talk[n.id]=1; save(); if(Object.keys(h.talk).length>=2) hqSeen('talk'); hqCheck('talk'); }
  if(n.mission==='m7'&&h.cup===1){ h.cup=2; save(); bubble={n,text:'謝謝你！這是同學遺失的環保杯，自備杯子就能少用好多一次性杯子！',t:4}; hqCheck('cup'); return true; }
  return false;
}
function hqDoneCount(){ return S&&S.hq&&S.hq.done?Object.keys(S.hq.done).length:0; }
function drawHidden(g){

function sparkle(g,x,y){ g.fillStyle='#fff8b0'; g.beginPath(); for(let k=0;k<8;k++){ const a=k*Math.PI/4, r=k%2?1.5:5; g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } g.closePath(); g.fill(); }

      ${done?`<span style="font-size:13px;color:#2f9e57;font-weight:bold;white-space:nowrap">🎁 已解鎖「${ac.name}」</span>`:''}</div>`; });

/* ---------------- 更新與繪製 ---------------- */
function updateNPCs(dt){
  for(const n of NPCS){
    if(n.moving){ const tx=n.x*TS, ty=n.y*TS, sp=55*dt; n.px+=clamp(tx-n.px,-sp,sp); n.py+=clamp(ty-n.py,-sp,sp); n.anim+=dt; n.step=Math.floor(n.anim*6)%2?1:2; if(n.px===tx&&n.py===ty){ n.moving=false; n.step=0; } continue; }
    if(!n.wander) continue;
    n.wt-=dt; if(n.wt>0) continue; n.wt=1+Math.random()*2.5;
    const d=['up','down','left','right'][Math.random()*4|0], [dx,dy]=DIRS[d], nx=n.x+dx, ny=n.y+dy;
    n.dir=d;
    if(tileAt(nx,ny)===n.zone && !occupied(nx,ny,n) && !UPS.has(nx+','+ny)){ n.x=nx; n.y=ny; n.moving=true; }
  }
}
function update(dt){
  gT+=dt;
  updateCars(dt);
  updateNPCs(dt);
  if(bubble){ bubble.t-=dt; if(bubble.t<=0) bubble=null; }
  if(!S) return;
  UPS=upSolid();
  if(PL.moving){ const tx=PL.x*TS, ty=PL.y*TS, sp=160*dt; PL.px+=clamp(tx-PL.px,-sp,sp); PL.py+=clamp(ty-PL.py,-sp,sp); PL.anim+=dt; PL.step=Math.floor(PL.anim*8)%2?1:2; if(PL.px===tx&&PL.py===ty){ PL.moving=false; hqStep(); } }
  if(!PL.moving && worldActive()){
    const d=curDir();
    if(d){ tryStep(d); } else if(PL.path||PL.goal) stepPath(); else PL.step=0;
  }
  const n=(!PL.moving)?facingNpc():null;
  const fk=!PL.moving&&tileAt(PL.x+DIRS[PL.dir][0],PL.y+DIRS[PL.dir][1])==='K';
  const txt = fk ? '🙏 空白鍵：看看小孔廟' : n ? (n.mission ? `💬 空白鍵／點一下：和「${n.name}」說話（${SPOTS[n.mission].title}）` : `💬 空白鍵：和${n.name}聊天`) : '方向鍵／WASD 移動｜空白鍵 說話｜也可以直接點地圖';
  const h=$('#hint'); if(h.textContent!==txt) h.textContent=txt;
}
function render(){
  cam.x=Math.round(clamp(PL.px+16-VW/2,0,MW*TS-VW)); cam.y=Math.round(clamp(PL.py+16-VH/2,0,MH*TS-VH));
  ctx.drawImage(mapCv,cam.x,cam.y,VW,VH,0,0,VW,VH);
  ctx.save(); ctx.translate(-cam.x,-cam.y);
  // 溪流波光
  for(let i=0;i<14;i++){ const y=((gT*40+i*97)%(MH*TS)), x=52*TS+8+((i*37)%100); ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10,y); ctx.stroke(); }
  if(S && upCount('solar')) drawSolarUpgrade(ctx,'red');
  drawHidden(ctx);
  for(const c of CARS) drawCar(ctx,c);
  // 任務光圈
  for(const n of NPCS){ if(!n.mission||!S) continue; const b=S.best[n.mission]; if(b&&b.stars) continue; if(n.mission==='fin'&&doneCount()<NM) continue;
    ctx.globalAlpha=.35+.2*Math.sin(gT*4); ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.ellipse(n.px+16,n.py+29,14,5,0,0,7); ctx.fill(); ctx.globalAlpha=1; }
  const ents=NPCS.map(n=>({k:'p',o:n,py:n.py}));
  if(S) ents.push({k:'p',o:PL,py:PL.py});
  for(const p of PROPS) if(p.x*TS>cam.x-80&&p.x*TS<cam.x+VW+32&&p.y*TS>cam.y-32&&p.y*TS<cam.y+VH+80) ents.push({k:'r',o:p,py:p.py});
  if(S){ for(const k of ['led','bike','rain','comp']) if(upCount(k)) UP_SPOTS[k].forEach(([x,y])=>ents.push({k:'r',o:{c:k,x,y},py:y*TS}));
    UP_SPOTS.tree.slice(0,upCount('tree')).forEach(([x,y])=>ents.push({k:'r',o:{c:'sap',x,y},py:y*TS})); }
  for(const B of COURTS) ents.push({k:'c',o:B,py:B.y2*TS+TS-1});
  ents.push({k:'c',o:STAGE,py:13*TS+TS-1});
  ents.sort((a,b)=>a.py-b.py||(a.k==='r')-(b.k==='r'));
  for(const e of ents){ if(e.k==='c') drawCanopy(ctx,e.o); else if(e.k==='r') drawProp(ctx,e.o); else drawPerson(ctx,e.o.px,e.o.py,e.o.dir,e.o.look,e.o.step); }
  // 名牌與驚嘆號
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const n of NPCS){
    if(!n.mission) continue;
    const s=SPOTS[n.mission], done=S&&S.best[n.mission]&&S.best[n.mission].stars, lock=n.mission==='fin'&&S&&doneCount()<NM;
    ctx.font='bold 12px "Microsoft JhengHei",sans-serif'; const w=ctx.measureText(n.name).width+26;
    ctx.fillStyle=done?'#2f9e57':lock?'#888':'#d9822b'; ctx.strokeStyle='rgba(43,34,51,.85)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(n.px+16-w/2,n.py+33,w,16,8); ctx.fill(); ctx.stroke();
    ctx.font='10px sans-serif'; ctx.fillText(s.ic,n.px+16-w/2+9,n.py+41.5);
    ctx.font='bold 12px "Microsoft JhengHei",sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(n.name,n.px+16+6,n.py+41.5);
    const mark = done ? '★' : lock ? '?' : '!';
    const by=n.py-22+(done?0:Math.sin(gT*5)*3);
    ctx.lineWidth=2; ctx.strokeStyle=OL; ctx.fillStyle=done?'#9be3a8':lock?'#ddd':'#ffe066';
    ctx.beginPath(); ctx.roundRect(n.px+7,by-10,18,20,6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(n.px+13,by+10); ctx.lineTo(n.px+16,by+15); ctx.lineTo(n.px+19,by+10); ctx.fill(); ctx.stroke(); ctx.fillRect(n.px+13.5,by+8,5,3);
    ctx.fillStyle=OL; ctx.font='900 15px sans-serif'; ctx.fillText(mark,n.px+16,by+1);
  }
  // 主角名牌
  if(S){ ctx.font='bold 11px "Microsoft JhengHei",sans-serif'; const w=ctx.measureText(S.name).width+12; ctx.fillStyle='#2f7fd1'; ctx.strokeStyle='rgba(43,34,51,.85)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(PL.px+16-w/2,PL.py+33,w,15,7); ctx.fill(); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillText(S.name,PL.px+16,PL.py+41); }
  // 面向 NPC 的提示箭頭
  const f=S&&!PL.moving?facingNpc():null;
  if(f&&!f.mission){ const ax=f.px+16, ay=f.py-14+Math.sin(gT*6)*3; ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ax-7,ay-6); ctx.lineTo(ax+7,ay-6); ctx.lineTo(ax,ay+3); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  // 聊天泡泡
  if(bubble){ const n=bubble.n; ctx.font='bold 13px "Microsoft JhengHei",sans-serif'; const w=ctx.measureText(bubble.text).width+18, x=n.px+16-w/2, y=n.py-42;
    ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(x,y,w,24,10); ctx.fill(); ctx.stroke(); ctx.fillStyle=OL; ctx.fillText(bubble.text,n.px+16,y+12.5); }
  ctx.restore();
  // 柔和暗角
  const gr=ctx.createRadialGradient(VW/2,VH/2,VH*.45,VW/2,VH/2,VH*.95); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(20,30,20,.28)'); ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  renderMini();
}
const miniCtx=$('#mini').getContext('2d');
function renderMini(){
  const m=miniCtx; m.clearRect(0,0,$('#mini').width,$('#mini').height); m.drawImage(miniCv,0,0);
  for(const n of NPCS){ if(!n.mission) continue; const done=S&&S.best[n.mission]&&S.best[n.mission].stars; m.fillStyle=done?'#2f9e57':'#ffcf3f'; m.strokeStyle=OL; m.lineWidth=1; m.fillRect(n.x*MS-2,n.y*MS-2,6,6); m.strokeRect(n.x*MS-2,n.y*MS-2,6,6); }
  m.strokeStyle='rgba(255,255,255,.9)'; m.lineWidth=1; m.strokeRect(cam.x/TS*MS,cam.y/TS*MS,VW/TS*MS,VH/TS*MS);
  m.fillStyle='#e2574c'; m.beginPath(); m.arc(PL.px/TS*MS+1.5,PL.py/TS*MS+1.5,3,0,7); m.fill(); m.strokeStyle='#fff'; m.stroke();
}
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  try{ update(dt); render(); }catch(e){ console.error(e); ctx.setTransform(1,0,0,1,0,0); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// 開始畫面的角色預覽
/* ---------------- 紙娃娃系統 ---------------- */
// 每一類可以自由選；標 lock 的服裝要完成對應的隱藏任務才能穿
const DRESS={
  hs:   {label:'髮型', type:'text',  opts:[['short','短髮'],['long','長髮'],['pony','馬尾'],['spiky','刺刺頭'],['bun','包包頭']]},
  hc:   {label:'髮色', type:'color', opts:['#1f1f1f','#3b2a1a','#6b3e1e','#a0652e','#e0b04a','#b8456a','#5b6fb8']},
  skin: {label:'膚色', type:'color', opts:['#fbe0c6','#f6d2b0','#f3c9a2','#e8b98f','#c98e62','#9a6640']},
  shirt:{label:'上衣', type:'color', opts:['#3c8de0','#e86a9a','#3cb371','#f0a030','#9b6bd6','#e25555','#4fc3c3','#ffd447','#f4f4f4','#5a5a5a']},
  pants:{label:'褲子', type:'color', opts:['#2c3e60','#3a3a3a','#4a3060','#6b4a2a','#3a7a4a','#8a2c3c','#7a8a9a']},
  hat:  {label:'帽子', type:'text',  opts:[['','不戴'],['cap','紅色棒球帽'],['ecocap','環保小帽','litter'],['helmet','探險安全帽','visit']]},
  face: {label:'眼鏡', type:'text',  opts:[['','不戴'],['glasses','眼鏡']]},
  deco: {label:'髮飾', type:'text',  opts:[['','無'],['bow','蝴蝶結','eco']]},
  outer:{label:'外套', type:'text',  opts:[['','無'],['vest','宣傳大使背心','talk']]},
  hand: {label:'手上', type:'text',  opts:[['','空手'],['drop','小水滴'],['veg','小菜苗'],['bulb','省電燈泡'],['leaf','綠葉小法杖','cup']]}
};
const PRESETS=[
  {hs:'short',hc:'#3b2a1a',skin:'#f6d2b0',shirt:'#3c8de0',pants:'#2c3e60'},
  {hs:'long', hc:'#3b2a1a',skin:'#f6d2b0',shirt:'#e86a9a',pants:'#4a3060'},
  {hs:'spiky',hc:'#1f1f1f',skin:'#e8b98f',shirt:'#3cb371',pants:'#3a3a3a'},
  {hs:'pony', hc:'#6b3e1e',skin:'#f3c9a2',shirt:'#f0a030',pants:'#6b4a2a'}
];
function buildLook(c){
  c=Object.assign({hat:'',face:'',deco:'',outer:'',hand:''},PRESETS[0],c||{});
  return {skin:c.skin, hair:c.hc, shirt:c.shirt, pants:c.pants, long:c.hs==='long', hstyle:c.hs,
    glasses:c.face==='glasses', bow:c.deco==='bow', vest:c.outer==='vest'?'#7ed957':undefined, item:c.hand||undefined,
    hat:c.hat==='helmet'?'helmet':(c.hat?'cap':undefined), hatColor:c.hat==='ecocap'?'#2e9d5b':'#e25555'};
}
function optLocked(o){ return o[2] && !(S&&S.hq&&S.hq.done&&S.hq.done[o[2]]); }
function paintAvatar(c,L,dir,scale,oy){ const g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height); g.save(); g.translate(c.width/2-16*scale,oy); g.scale(scale,scale); drawPerson(g,0,0,dir,L,0,true); g.restore(); }
let dressDir=0, dressCur=null, dressInGame=false;
const DIRS4=['down','right','up','left'];
function openDresser(inGame){
  dressInGame=inGame; dressDir=0;
  dressCur=Object.assign({hat:'',face:'',deco:'',outer:'',hand:''}, inGame?S.custom:(pickCustom||PRESETS[typeof pickAv==='number'?pickAv:0]));
  renderDresser();
}
function renderDresser(){
  let h=`<h2>🎨 紙娃娃換裝</h2><div class="dress"><div class="dprev"><canvas id="dPrev" width="150" height="170"></canvas>
    <div class="row" style="margin-top:4px"><button class="ghost" id="dRotL">↺</button><button class="ghost" id="dRotR">↻</button></div>
    <div class="row" style="margin-top:4px"><button class="ghost" id="dRand">🎲 隨機</button></div></div><div class="dopts">`;
  for(const [k,d] of Object.entries(DRESS)){
    h+=`<div class="drow"><b>${d.label}</b><div class="dsw">`;
    d.opts.forEach((o,i)=>{
      if(d.type==='color') h+=`<button class="sw ${dressCur[k]===o?'on':''}" data-k="${k}" data-i="${i}" style="background:${o}" aria-label="${d.label}"></button>`;
      else { const lock=optLocked(o); h+=`<button class="tx ${dressCur[k]===o[0]?'on':''} ${lock?'lk':''}" data-k="${k}" data-i="${i}" ${lock?`title="完成隱藏任務「${HQ[o[2]].name}」解鎖"`:''}>${lock?'🔒 ':''}${o[1]}</button>`; }
    });
    h+='</div></div>';
  }
  h+=`</div></div><div class="row"><button id="dOk">✔ 就穿這樣</button><button class="gray" id="dCancel">取消</button></div>`;
  openModal(h);
  paintAvatar($('#dPrev'),buildLook(dressCur),DIRS4[dressDir],4,30);
  document.querySelectorAll('.dsw button').forEach(b=>b.onclick=()=>{ const d=DRESS[b.dataset.k], o=d.opts[+b.dataset.i];
    if(d.type!=='color'&&optLocked(o)){ toast(`🔒 完成隱藏任務「${HQ[o[2]].name}」才能穿喔！`); return; }
    dressCur[b.dataset.k]=d.type==='color'?o:o[0]; beep(true); renderDresser(); });
  $('#dRotL').onclick=()=>{ dressDir=(dressDir+3)%4; renderDresser(); };
  $('#dRotR').onclick=()=>{ dressDir=(dressDir+1)%4; renderDresser(); };
  $('#dRand').onclick=()=>{ for(const [k,d] of Object.entries(DRESS)){ const ok=d.opts.filter(o=>d.type==='color'||!optLocked(o)); const o=ok[Math.random()*ok.length|0]; dressCur[k]=d.type==='color'?o:o[0]; } renderDresser(); };
  $('#dOk').onclick=()=>{
    if(dressInGame){ S.custom=Object.assign({},dressCur); save(); setPlayerLook(); toast('👕 換好囉！'); }
    else { pickCustom=Object.assign({},dressCur); selectAvTile('custom'); refreshCustomTile(); }
    closeModal(); };
  $('#dCancel').onclick=closeModal;
}
function refreshCustomTile(){ const c=document.querySelector('.avc canvas'); if(c) paintAvatar(c,buildLook(pickCustom||PRESETS[0]),'down',1.55,19); }
// 開始畫面的角色預覽
document.querySelectorAll('.avs button:not(.avc) canvas').forEach((c,i)=>paintAvatar(c,buildLook(PRESETS[i]),'down',1.55,19));
pickCustom=Object.assign({},PRESETS[0]); refreshCustomTile();
function setPlayerLook(){
  hqInit();
  if(!S.custom){ // 舊存檔：從以前的角色編號＋隱藏造型轉換
    const ACCMAP={cap:{hat:'ecocap'},bow:{deco:'bow'},vest:{outer:'vest'},leaf:{hand:'leaf'},helmet:{hat:'helmet'}};
    S.custom=Object.assign({},PRESETS[(typeof S.av==='number'&&PRESETS[S.av])?S.av:0],S.acc?ACCMAP[S.acc]:{}); save();
  }
  PL.look=buildLook(S.custom);
}

$('#tUp').onclick=showUpgrades; $('#tAch').onclick=showAch; $('#tHid').onclick=showHidden; $('#tDress').onclick=()=>openDresser(true); $('#tBoard').onclick=()=>showBoard('all'); $('#tHelp').onclick=()=>showHelp(false);
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('hidden')) return;
  if(/^[1-4]$/.test(e.key)){ const bs=document.querySelectorAll('#stepBox .opts button'); const b=bs[+e.key-1]; if(b&&!b.disabled) b.click(); }
  else if(e.key==='Enter'){ const b=document.querySelector('#stepBox .row button:not(:disabled)'); if(b&&document.activeElement!==b){ e.preventDefault(); b.click(); } }
});
